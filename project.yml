name: LabelFold
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: 'YES'
targets:
  LabelFold:
    type: application
    platform: iOS
    sources:
    - LabelFold.swift
    - Phone/Assets.xcassets
    - Catalog/StarterCatalog.json
    - Config/PrivacyInfo.xcprivacy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        PRODUCT_BUNDLE_IDENTIFIER: app.labelfold.food
        INFOPLIST_FILE: Config/Phone.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
    - target: LabelFoldWidget
      embed: true
  LabelFoldWidget:
    type: app-extension
    platform: iOS
    sources:
    - LabelFold.swift
    - Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelfold.food.widget
        INFOPLIST_FILE: Config/Widget.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LABELFOLD_WIDGET
  LabelFoldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelfold.food.tests
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
    - target: LabelFold
  LabelFoldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelfold.food.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: LabelFold
    dependencies:
    - target: LabelFold
schemes:
  LabelFold:
    build:
      targets:
        LabelFold: all
    test:
      targets:
      - LabelFoldTests
      - LabelFoldUITests
  LabelFoldWidget:
    build:
      targets:
        LabelFoldWidget: all
